<!DOCTYPE html>
<html>
<head>
    <title>AutoHDR | OCR结果</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        AutoHDR | OCR结果
        <a href="{{ url_for('index') }}" class="header__nav-btn">返回上传</a>
    </div>
    <div class="main-flex">
        <div class="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-title">
                    框信息
                </div>
                <form id="rect-form">
                    <div id="rect-form-list"></div>
                </form>
            </div>
            <div class="sidebar-controls">
                <div class="sidebar-controls-row">
                    <button id="draw-btn" class="btn btn-primary" type="button">添加框</button>
                    <select id="rect-color" title="选择框颜色">
                        <option value="#7fffd4" selected>绿色</option>
                        <option value="#ff0000">红色</option>
                        <option value="#888888">灰色</option>
                        <option value="#060ac9">蓝色</option>
                        <option value="#097b7e">青色</option>
                        <option value="#e4710a">橙色</option>
                        <option value="#ffffff">白色</option>
                    </select>
                </div>
                <div class="sidebar-controls-row">
                    <button id="other-btn" class="btn btn-primary" type="button">显示标签</button>
                    <button id="zoom-btn" class="btn btn-primary" type="button">适应页面</button>
                </div>
                <div class="sidebar-controls-row">
                    <button id="next-step-btn" class="btn btn--next-step" type="button">
                        下一步：预测补全
                    </button>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="draw-area" id="draw-area">
                {% if image_url %}
                <img id="main-image" src="{{ image_url }}" alt="图片"
                     draggable="false"
                     oncontextmenu="return false;"
                     style="user-select: none; -webkit-user-drag: none; -webkit-user-select: none;">
                {% else %}
                <div style="padding: 40px; text-align: center; color: #666;">
                    <h3>图片加载失败</h3>
                    <p>请检查文件是否存在</p>
                </div>
                {% endif %}
                <!-- 矩形框会插入到这里 -->
            </div>
            
            {% if logs %}
            <div class="log-area">
                {% for log in logs %}
                    <div>{{ log }}</div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rect.js') }}"></script>
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        // 等待图片加载完成后再初始化RectUI
        const img = document.getElementById('main-image');
        if (!img) {
            console.error('Image not found');
            return;
        }
        
        function initializeRectUI() {
            const drawBtn = document.getElementById('draw-btn');
            const otherBtn = document.getElementById('other-btn');
            const drawArea = document.getElementById('draw-area');
            const rectFormList = document.getElementById('rect-form-list');
            const colorInput = document.getElementById('rect-color');
            const zoomBtn = document.getElementById('zoom-btn');
            
            // 创建RectUI实例
            const rectUI = new RectUI(
                drawArea,
                rectFormList,
                colorInput,
                drawBtn,
                otherBtn,
                zoomBtn
            );
            
            // 加载初始数据
            const initialRectsStr = `{{ initial_rects | safe }}`;
            console.log('Initial rects data:', initialRectsStr);
            
            if (initialRectsStr && initialRectsStr !== 'None' && initialRectsStr.trim() !== '') {
                try {
                    const manager = RectManager.from_json(initialRectsStr);
                    rectUI.rectManager.setRects(manager.rects);
                    rectUI.rectManager.onChange();
                    console.log('Loaded rects:', manager.rects.length);
                } catch(e) {
                    console.error('Failed to parse initial_rects:', e);
                    console.log('Raw data:', initialRectsStr);
                }
            } else {
                console.log('No initial rects data');
            }
            
            window.rectUI = rectUI;

            // 下一步按钮事件
            const nextStepBtn = document.getElementById('next-step-btn');
            nextStepBtn.onclick = function() {
                const predictStages = [
                    '准备进入预测阶段...',
                    '正在加载语言模型...',
                    '正在分析上下文...',
                    '正在预测缺失文字...',
                    '正在生成预测结果...'
                ];
                loadingModal.showWithProgress('正在预测', predictStages);
                
                const rectsData = rectUI.rectManager.to_json();
                
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/predict';
                form.style.display = 'none';
                
                const originalInput = document.createElement('input');
                originalInput.type = 'hidden';
                originalInput.name = 'original_filename';
                originalInput.value = '{{ original }}';
                form.appendChild(originalInput);
                
                const rectsInput = document.createElement('input');
                rectsInput.type = 'hidden';
                rectsInput.name = 'rects_data';
                rectsInput.value = rectsData;
                form.appendChild(rectsInput);
                
                document.body.appendChild(form);
                form.submit();
            };
        }
        
        // 图片加载完成后初始化
        if (img.complete) {
            initializeRectUI();
        } else {
            img.onload = initializeRectUI;
            img.onerror = function() {
                console.error('Image failed to load');
            };
        }
    });
    </script>
</body>
</html>
