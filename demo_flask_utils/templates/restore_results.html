<!DOCTYPE html>
<html>
<head>
    <title>AutoHDR | 修复完成</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        AutoHDR | 修复完成
        <a href="{{ url_for('index') }}" class="header__nav-btn">返回上传</a>
    </div>
    
    <!-- 全屏图片显示区域 -->
    <div class="restore-main">
        <!-- 单图显示模式 -->
        <div class="restore-image-container" id="single-view">
            <h3 class="restore-image-title">修复后</h3>
            <img src="{{ restore_url }}" alt="修复后的图片" class="restore-main-image" id="main-display-image"
                 data-restored="{{ restore_url }}" data-original="{{ original_url }}">
        </div>
        
        <!-- 对比视图（初始隐藏） -->
        <div class="restore-comparison-view" id="comparison-view" style="display: none;">
            <div class="restore-comparison-item">
                <h3>修复前</h3>
                <img src="{{ original_url }}" alt="原始图片" class="restore-comparison-image">
            </div>
            <div class="restore-comparison-item">
                <h3>修复后</h3>
                <img src="{{ restore_url }}" alt="修复后的图片" class="restore-comparison-image">
            </div>
        </div>
    </div>
    
    <!-- 底部操作栏 -->
    <div class="restore-bottom-bar">
        <!-- 第一行：信息显示 -->
        <div class="restore-info-row">
            <div class="restore-info-item">
                <span class="restore-info-label">原始文件：</span>
                <span class="restore-info-value">{{ original }}</span>
            </div>
            <div class="restore-info-item">
                <span class="restore-info-label">修复状态：</span>
                <span class="restore-info-value status-success">修复完成</span>
            </div>
            <div class="restore-info-item">
                <span class="restore-info-label">处理时间：</span>
                <span class="restore-info-value">定位: ?s | 预测: ?s | 修复: ?s</span>
            </div>
        </div>
        
        <!-- 第二行：操作按钮 -->
        <div class="restore-action-row">
            <button id="compare-mode-btn" class="btn btn-secondary">
                按住对比原图
            </button>
            <button id="toggle-view-btn" class="btn btn-secondary">
                并排对比视图
            </button>
            <button id="download-btn" class="btn btn-primary">
                下载修复结果
            </button>
            <button id="new-task-btn" class="btn btn-secondary">
                处理新图片
            </button>
        </div>
    </div>
    
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        const toggleViewBtn = document.getElementById('toggle-view-btn');
        const compareModeBtn = document.getElementById('compare-mode-btn');
        const singleView = document.getElementById('single-view');
        const comparisonView = document.getElementById('comparison-view');
        const mainImage = document.getElementById('main-display-image');
        const downloadBtn = document.getElementById('download-btn');
        const newTaskBtn = document.getElementById('new-task-btn');
        const imageTitle = singleView.querySelector('.restore-image-title');
        
        let isComparisonMode = false;
        let isCompareMode = false;
        let isMouseDown = false;
        let isSpacePressed = false;
        
        // 切换并排对比视图
        toggleViewBtn.onclick = function() {
            if (isComparisonMode) {
                // 切换回单图模式
                singleView.style.display = 'flex';
                comparisonView.style.display = 'none';
                toggleViewBtn.textContent = '并排对比视图';
                compareModeBtn.style.display = 'inline-block';
                
                // 确保恢复到修复后图片和标题
                mainImage.src = mainImage.dataset.restored;
                imageTitle.textContent = '修复后';
                
                isComparisonMode = false;
            } else {
                // 切换到并排对比视图
                singleView.style.display = 'none';
                comparisonView.style.display = 'flex';
                toggleViewBtn.textContent = '单图显示';
                compareModeBtn.style.display = 'none';
                isComparisonMode = true;
            }
        };
        
        // 按住对比模式
        function startCompare() {
            if (!isComparisonMode && !isCompareMode) {
                isCompareMode = true;
                mainImage.src = mainImage.dataset.original;
                imageTitle.textContent = '修复前';
                compareModeBtn.textContent = '松开查看修复后';
            }
        }
        
        function endCompare() {
            if (isCompareMode) {
                isCompareMode = false;
                mainImage.src = mainImage.dataset.restored;
                imageTitle.textContent = '修复后';
                compareModeBtn.textContent = '按住对比原图';
            }
        }
        
        // 鼠标按住对比
        mainImage.addEventListener('mousedown', function(e) {
            if (e.button === 0) { // 左键
                isMouseDown = true;
                startCompare();
            }
        });
        
        document.addEventListener('mouseup', function() {
            if (isMouseDown) {
                isMouseDown = false;
                endCompare();
            }
        });
        
        // 空格键对比
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !isSpacePressed) {
                e.preventDefault();
                isSpacePressed = true;
                startCompare();
            }
        });
        
        document.addEventListener('keyup', function(e) {
            if (e.code === 'Space' && isSpacePressed) {
                e.preventDefault();
                isSpacePressed = false;
                endCompare();
            }
        });
        
        // 按钮点击对比（用于移动设备）
        compareModeBtn.addEventListener('mousedown', function(e) {
            e.preventDefault();
            startCompare();
        });
        
        compareModeBtn.addEventListener('mouseup', function(e) {
            e.preventDefault();
            endCompare();
        });
        
        compareModeBtn.addEventListener('mouseleave', function(e) {
            endCompare();
        });
        
        // 下载功能
        downloadBtn.onclick = function() {
            const link = document.createElement('a');
            link.href = '{{ restore_url }}';
            link.download = '{{ restore_filename }}';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
        
        // 新任务
        newTaskBtn.onclick = function() {
            window.location.href = '{{ url_for("index") }}';
        };
    });
    </script>
</body>
</html>
